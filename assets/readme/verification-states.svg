<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="196" viewBox="0 0 1120 196" role="img" aria-labelledby="t d">
<title id="t">MigrationX verification states</title><desc id="d">Five distinct outcomes: passed, observed in simulation, statically detected, could not verify, and unsupported scenario. Unverified is never treated as passed.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b1a"/><stop offset="1" stop-color="#0b0e0d"/></linearGradient><style>
.k{font:600 10px ui-monospace,monospace;letter-spacing:1.2px;fill:#8da697}.h{font:700 13px system-ui,sans-serif;fill:#f4f2ec}.s{font:11px system-ui,sans-serif;fill:#a6aaa4}.node{fill:#202723;stroke:#435148;stroke-width:1}.lamp{animation:lamp 4s ease-in-out infinite}.n2{animation-delay:.8s}.n3{animation-delay:1.6s}.n4{animation-delay:2.4s}.n5{animation-delay:3.2s}@keyframes lamp{0%,18%,100%{opacity:.35}8%{opacity:1;filter:drop-shadow(0 0 5px currentColor)}}@media(prefers-reduced-motion:reduce){.lamp{animation:none;opacity:.8}}
</style></defs>
<rect x="1" y="1" width="1118" height="194" rx="18" fill="url(#bg)" stroke="#344139"/>
<text x="26" y="31" class="k">VERIFICATION STATES / FIVE DISTINCT OUTCOMES</text>
<g transform="translate(24 52)"><rect class="node" width="204" height="91" rx="11"/><circle cx="20" cy="24" r="5" fill="#8da697" class="lamp" style="color:#8da697"/><text x="34" y="28" class="h">PASSED</text><text x="16" y="57" class="s">Verified with required evidence</text></g>
<g transform="translate(244 52)"><rect class="node" width="204" height="91" rx="11"/><circle cx="20" cy="24" r="5" fill="#ed3426" class="lamp n2" style="color:#ed3426"/><text x="34" y="28" class="h">OBSERVED</text><text x="16" y="57" class="s">Runtime hazard confirmed</text></g>
<g transform="translate(464 52)"><rect class="node" width="204" height="91" rx="11"/><circle cx="20" cy="24" r="5" fill="#eda231" class="lamp n3" style="color:#eda231"/><text x="34" y="28" class="h">STATICALLY DETECTED</text><text x="16" y="57" class="s">AST rule found a hazard</text></g>
<g transform="translate(684 52)"><rect class="node" width="204" height="91" rx="11"/><circle cx="20" cy="24" r="5" fill="#71a8a0" class="lamp n4" style="color:#71a8a0"/><text x="34" y="28" class="h">COULD NOT VERIFY</text><text x="16" y="57" class="s">Insufficient evidence ≠ safe</text></g>
<g transform="translate(904 52)"><rect class="node" width="192" height="91" rx="11"/><circle cx="20" cy="24" r="5" fill="#8a8d86" class="lamp n5" style="color:#8a8d86"/><text x="34" y="28" class="h">UNSUPPORTED</text><text x="16" y="57" class="s">Outside current capability</text></g>
<text x="26" y="171" class="k">CORE RULE</text><text x="112" y="171" class="s">UNKNOWN IS NOT SAFE. MISSING EVIDENCE MUST NEVER BECOME A PASS.</text></svg>