<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
<title id="title">MigrationX migration verification pipeline</title><desc id="desc">Migration SQL passes through AST analysis and disposable PostgreSQL simulation. Typed evidence becomes an explicit verification verdict.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b1a"/><stop offset="1" stop-color="#0b0e0d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.k{font:600 11px ui-monospace,monospace;letter-spacing:1.4px;fill:#8da697}.h{font:700 16px system-ui,sans-serif;fill:#f6f4ee}.s{font:12px system-ui,sans-serif;fill:#a6aaa4}.wire{stroke:#56645b;stroke-width:1.5;fill:none;stroke-dasharray:5 7}.pulse{animation:pulse 2.2s ease-in-out infinite}.packet{fill:#ed3426;filter:url(#glow);animation:flow 4s linear infinite}.packet2{fill:#eda231;filter:url(#glow);animation:flow 4s linear infinite 1.4s}.scan{animation:scan 3.5s ease-in-out infinite}.bar{animation:bar 1.8s ease-in-out infinite alternate}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes flow{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(760px);opacity:0}}@keyframes scan{0%,100%{opacity:.2}50%{opacity:1}}@keyframes bar{from{transform:scaleX(.35);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}@media(prefers-reduced-motion:reduce){.pulse,.packet,.packet2,.scan,.bar{animation:none}}
</style></defs>
<rect x="1" y="1" width="1118" height="328" rx="18" fill="url(#bg)" stroke="#303a34"/><text x="28" y="34" class="k">MIGRATIONX / VERIFICATION PIPELINE</text><text x="1090" y="34" text-anchor="end" class="s">STATIC EVIDENCE + RUNTIME OBSERVATION</text>
<path d="M226 151H280 M480 151H535 M735 151H790 M990 151H1045" class="wire"/>
<g transform="translate(28 85)"><rect width="198" height="132" rx="12" fill="#202723" stroke="#53645a"/><text x="16" y="27" class="k">01 / INPUT</text><text x="16" y="57" class="h">Migration SQL</text><text x="16" y="80" class="s">Schema snapshot*</text><text x="16" y="101" class="s">N-1 query workload*</text><rect x="16" y="112" width="164" height="4" rx="2" fill="#35433a"/><rect x="16" y="112" width="105" height="4" rx="2" fill="#8da697" class="bar"/></g>
<g transform="translate(280 85)"><rect width="200" height="132" rx="12" fill="#25302a" stroke="#8da697" stroke-width="1.4"/><text x="16" y="27" class="k">02 / STATIC</text><text x="16" y="57" class="h">AST Analyzer</text><text x="16" y="80" class="s">pg_query · PostgreSQL AST</text><text x="16" y="101" class="s">Lock &amp; rewrite hazards</text><circle cx="176" cy="22" r="5" fill="#ed3426" class="pulse"/></g>
<g transform="translate(535 85)"><rect width="200" height="132" rx="12" fill="#202723" stroke="#53645a"/><text x="16" y="27" class="k">03 / SIMULATION</text><text x="16" y="57" class="h">Disposable PG</text><text x="16" y="80" class="s">pg_locks · pg_stat_activity</text><text x="16" y="101" class="s">PREPARE N-1 checks</text><path d="M16 116H184" stroke="#eda231" stroke-width="2" stroke-dasharray="3 5" class="scan"/></g>
<g transform="translate(790 85)"><rect width="200" height="132" rx="12" fill="#202723" stroke="#53645a"/><text x="16" y="27" class="k">04 / CONTRACTS</text><text x="16" y="57" class="h">Typed Evidence</text><text x="16" y="80" class="s">StaticFindings</text><text x="16" y="101" class="s">RuntimeVerdict</text><circle cx="176" cy="22" r="5" fill="#8da697" class="pulse"/></g>
<g transform="translate(1045 116)"><circle cx="22" cy="35" r="22" fill="#26342b" stroke="#8da697"/><path d="M12 35l7 7 14-16" fill="none" stroke="#8da697" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/></g>
<circle cx="242" cy="151" r="4" class="packet"/><circle cx="494" cy="151" r="4" class="packet2"/><circle cx="750" cy="151" r="4" class="packet"/><circle cx="1005" cy="151" r="4" class="packet2"/>
<text x="28" y="260" class="s">* Snapshot collection and end-to-end CLI orchestration are planned integration work.</text><text x="28" y="286" class="k">VERIFICATION IS NOT BINARY</text><text x="1090" y="286" text-anchor="end" class="s">PASSED ≠ COULD_NOT_VERIFY</text><rect x="28" y="300" width="1064" height="4" rx="2" fill="#26312a"/><rect x="28" y="300" width="530" height="4" rx="2" fill="#8da697" class="pulse"/></svg>