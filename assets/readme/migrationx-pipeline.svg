<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="t d">
<title id="t">MigrationX dual-path migration verification</title><desc id="d">Migration SQL flows into PostgreSQL AST analysis and disposable PostgreSQL simulation. Typed evidence feeds a verification verdict. Full CLI orchestration remains planned.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b1a"/><stop offset="1" stop-color="#090c0b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.k{font:600 11px ui-monospace,monospace;letter-spacing:1.5px;fill:#8da697}.h{font:700 17px system-ui,sans-serif;fill:#f8f7f2}.s{font:12px system-ui,sans-serif;fill:#a8ada7}.muted{font:11px ui-monospace,monospace;fill:#68756c}.line{fill:none;stroke:#526258;stroke-width:2;stroke-dasharray:6 8}.flow{fill:none;stroke:#eda231;stroke-width:2;stroke-dasharray:5 9;animation:dash 2.6s linear infinite}.flow2{fill:none;stroke:#ed3426;stroke-width:2;stroke-dasharray:5 9;animation:dash 2.6s linear infinite reverse}.dot{filter:url(#glow);animation:travel 3.6s linear infinite}.dot2{filter:url(#glow);animation:travel 3.6s linear infinite 1.5s}.beat{animation:beat 2.2s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-56}}@keyframes travel{0%{transform:translateX(0);opacity:0}12%,82%{opacity:1}100%{transform:translateX(700px);opacity:0}}@keyframes beat{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.flow2,.dot,.dot2,.beat{animation:none}}
</style></defs>
